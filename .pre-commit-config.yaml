repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff lint
        language: system
        entry: .venv/bin/ruff check
        args: [--fix]
        types: [python]
        pass_filenames: true

      - id: ruff-format
        name: ruff format
        language: system
        entry: .venv/bin/ruff format
        types: [python]
        pass_filenames: true

      - id: pyright
        name: pyright type check
        language: system
        entry: .venv/bin/pyright
        pass_filenames: false
        always_run: true
