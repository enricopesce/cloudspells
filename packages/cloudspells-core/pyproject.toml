[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cloudspells-core"
version = "0.2.0"
description = "Cloud-neutral abstractions and base classes for CloudSpells"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 3 - Alpha",
]
dependencies = [
    "pulumi>=3.204.0,<4",
]

[tool.hatch.build.targets.wheel]
packages = ["src/cloudspells"]
