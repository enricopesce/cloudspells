[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cloudspells-oci"
version = "0.2.0"
description = "OCI provider spells for CloudSpells"
license = { text = "Apache-2.0" }
requires-python = ">=3.8"
classifiers = [
    "Development Status :: 3 - Alpha",
]
dependencies = [
    "cloudspells-core>=0.2.0",
    "pulumi>=3.204.0,<4",
    "pulumi-oci>=3.9.0,<4",
]

[tool.hatch.build.targets.wheel]
packages = ["src/cloudspells"]
