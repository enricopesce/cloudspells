name: Feature Request
description: Propose a new spell, enhancement, or cloud provider support
labels: ["enhancement", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Before opening a feature request, check the [roadmap](https://github.com/enricopesce/ociblocks#roadmap) and existing issues.

  - type: dropdown
    id: type
    attributes:
      label: Type of request
      options:
        - New OCI Spell
        - New Cloud Provider (AWS / GCP / Azure)
        - Enhancement to existing spell
        - Core framework improvement
        - Documentation
        - Other
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem statement
      description: What infrastructure pain does this solve?
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
    validations:
      required: true

  - type: textarea
    id: api-sketch
    attributes:
      label: Example API sketch
      description: Optional — show what calling this would look like
      render: python

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered

  - type: textarea
    id: context
    attributes:
      label: Additional context
