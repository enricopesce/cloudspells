name: Publish

on:
  push:
    tags:
      - "cloudspells-core-v*"
      - "cloudspells-oci-v*"
      - "cloudspells-cli-v*"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  package:
    name: Resolve package
    runs-on: ubuntu-latest
    outputs:
      package: ${{ steps.release.outputs.package }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Resolve package from tag
        id: release
        run: |
          tag="${GITHUB_REF_NAME}"
          case "$tag" in
            cloudspells-core-v*)
              package="cloudspells-core"
              version="${tag#cloudspells-core-v}"
              ;;
            cloudspells-oci-v*)
              package="cloudspells-oci"
              version="${tag#cloudspells-oci-v}"
              ;;
            cloudspells-cli-v*)
              package="cloudspells-cli"
              version="${tag#cloudspells-cli-v}"
              ;;
            *)
              echo "Unsupported release tag: $tag" >&2
              exit 1
              ;;
          esac

          echo "package=$package" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  quality:
    name: Lint & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Lint
        run: ruff check packages/ tests/ && ruff format --check packages/ tests/

      - name: Type check
        run: pyright

      - name: Test
        run: pytest

      - name: Dead code check
        run: vulture packages/ --min-confidence 80

  build:
    name: Build ${{ needs.package.outputs.package }}
    runs-on: ubuntu-latest
    needs: [package, quality]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate package version
        env:
          PACKAGE_NAME: ${{ needs.package.outputs.package }}
          PACKAGE_VERSION: ${{ needs.package.outputs.version }}
        run: |
          python - <<'PY'
          import ast
          import os
          from pathlib import Path
          import tomllib

          package_name = os.environ["PACKAGE_NAME"]
          expected = os.environ["PACKAGE_VERSION"]
          package_root = Path("packages") / package_name
          pyproject = package_root / "pyproject.toml"
          project = tomllib.loads(pyproject.read_text(encoding="utf-8"))["project"]
          actual = project["version"]

          if actual != expected:
              raise SystemExit(
                  f"{package_name} tag version {expected!r} does not match pyproject version {actual!r}"
              )

          if package_name == "cloudspells-cli":
              init_file = package_root / "src/cloudspells/cli/__init__.py"
              module = ast.parse(init_file.read_text(encoding="utf-8"))
              cli_version = None
              for node in module.body:
                  if isinstance(node, ast.Assign):
                      targets = [target.id for target in node.targets if isinstance(target, ast.Name)]
                      if "__version__" in targets and isinstance(node.value, ast.Constant):
                          cli_version = node.value.value
                          break
              if cli_version != expected:
                  raise SystemExit(
                      f"cloudspells-cli __version__ {cli_version!r} does not match tag version {expected!r}"
                  )
          PY

      - name: Build distribution
        env:
          PACKAGE_NAME: ${{ needs.package.outputs.package }}
        run: |
          pip install build
          python -m build "packages/${PACKAGE_NAME}" --outdir dist

      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ needs.package.outputs.package }}
          path: dist/*

  publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: [package, build]
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist-${{ needs.package.outputs.package }}
          path: dist/

      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1
