name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  quality-gate:
    name: Quality gate (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ matrix.python-version }}-${{ hashFiles('requirements.txt') }}-${{ hashFiles('packages/*/pyproject.toml') }}
          restore-keys: |
            pip-${{ matrix.python-version }}-

      - name: Install dependencies
        run: |
          python -m venv .venv
          .venv/bin/pip install -r requirements.txt
          .venv/bin/pip install -e packages/cloudspells-core -e packages/cloudspells-oci
          .venv/bin/pip install --ignore-requires-python -e packages/cloudspells-cli
          PYVER=$(.venv/bin/python -c "import sys; print(f'{sys.version_info.major}.{sys.version_info.minor}')")
          echo "$(pwd)/packages/cloudspells-cli/src" > .venv/lib/python${PYVER}/site-packages/cloudspells-cli-src.pth

      - name: Lint (ruff)
        run: .venv/bin/ruff check packages/ tests/

      - name: Format check (ruff)
        run: .venv/bin/ruff format --check packages/ tests/

      - name: Debug venv
        run: |
          echo "=== .pth files ==="
          ls .venv/lib/python*/site-packages/*.pth
          echo "=== cloudspells .pth contents ==="
          cat .venv/lib/python*/site-packages/*cloudspells*.pth || true
          echo "=== manual .pth ==="
          cat .venv/lib/python*/site-packages/cloudspells-cli-src.pth || echo "NOT FOUND"
          echo "=== python sys.path cloudspells entries ==="
          .venv/bin/python -c "import sys; [print(p) for p in sys.path if 'cloudspells' in p or 'cli' in p]"
          echo "=== import test ==="
          .venv/bin/python -c "import cloudspells.cli.automation.passphrase; print('OK:', cloudspells.cli.automation.passphrase.__file__)"

      - name: Type check (pyright)
        run: .venv/bin/pyright

      - name: Tests with coverage
        run: .venv/bin/pytest

      - name: Dead code check (vulture)
        run: .venv/bin/vulture packages/ --min-confidence 80

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-py${{ matrix.python-version }}
          path: .coverage
          retention-days: 7
