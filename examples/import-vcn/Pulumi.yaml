name: blocks-import-vcn
runtime:
  name: python
  options:
    virtualenv: ../../.venv
description: Import an existing VCN from another Pulumi project stack
config:
  vcn_stack:
    type: string
    description: >
      Pulumi stack reference for the VCN stack.
      Format: "<organization>/<project>/<stack>" for Pulumi Cloud,
              "<project>/<stack>" for local file backend.
      Example: "acme/blocks-vcn/prod"
