[tool.ruff]
line-length = 120
target-version = "py311"
preview = true

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "D",        # pydocstyle (Google-style docstrings)
    "DOC",      # pydoclint — missing Returns/Yields/Raises sections
    "B",        # flake8-bugbear
    "UP",       # pyupgrade
    "SIM",      # flake8-simplify
    "RUF",      # ruff-specific rules
    "C901",     # McCabe complexity
]
ignore = [
    "D105",    # missing docstring in magic method
    "D107",    # missing docstring in __init__ (covered by class docstring)
    "RUF002",  # EN dash in docstrings — intentional typographic style
    "RUF003",  # EN dash in comments — intentional typographic style
    "DOC502",  # raised exception not explicitly raised — fires on delegated raises (e.g. pulumi internals)
]

[tool.ruff.lint.mccabe]
max-complexity = 12

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D", "DOC", "E402", "C901"]  # no docstring enforcement; E402 because set_mocks() must precede imports; C901 mocks.py dispatch is intentionally long
"packages/cloudspells-cli/tests/*" = ["D", "DOC", "E402", "C901"]
# __all__ lists below use deliberate semantic groupings with comments — alphabetical sort would destroy the grouping
"packages/cloudspells-core/src/cloudspells/core/abstractions/__init__.py" = ["RUF022"]
"packages/cloudspells-core/src/cloudspells/core/ports.py" = ["RUF022"]
"packages/cloudspells-oci/src/cloudspells/providers/oci/__init__.py" = ["RUF022"]
"packages/cloudspells-oci/src/cloudspells/providers/oci/nsg.py" = ["RUF022"]

[tool.pytest.ini_options]
addopts = "--cov=packages --cov-report=term-missing --cov-fail-under=85"
testpaths = ["tests", "packages/cloudspells-cli/tests"]
pythonpath = [
    "packages/cloudspells-core/src",
    "packages/cloudspells-oci/src",
    "packages/cloudspells-cli/src",
]

[tool.vulture]
# pytest fixtures and Typer callback parameters are wired by decorators/framework
# introspection, which vulture cannot see — these names are intentionally "unused".
ignore_names = ["mock_*", "version"]

[tool.coverage.run]
source = ["cloudspells"]
omit = ["*/__init__.py"]

[tool.coverage.report]
show_missing = true
