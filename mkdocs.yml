site_name: CloudBlocks
site_description: High-level Pulumi building blocks for Oracle Cloud Infrastructure
repo_url: https://github.com/enricopesce/ociblocks
repo_name: enricopesce/ociblocks

theme:
  name: material
  features:
    - navigation.tabs
    - navigation.indexes
    - navigation.top
    - search.highlight
  palette:
    - scheme: default
      primary: red
      accent: red

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: google
            show_source: true
            show_signature_annotations: true
            members_order: source
            show_root_heading: true

nav:
  - Home: index.md
  - API Reference:
    - Core:
      - api/core/base.md
      - api/core/naming.md
      - api/core/tagging.md
      - api/core/helper.md
    - Abstractions:
      - api/core/abstractions/network.md
      - api/core/abstractions/compute.md
      - api/core/abstractions/kubernetes.md
      - api/core/abstractions/bastion.md
      - api/core/abstractions/autoscale.md
    - Blocks:
      - api/blocks/vcn.md
      - api/blocks/compute.md
      - api/blocks/oke.md
      - api/blocks/bastion.md
      - api/blocks/autoscale.md
    - OCI Provider:
      - api/providers/network.md
      - api/providers/compute.md
      - api/providers/kubernetes.md
      - api/providers/bastion.md
      - api/providers/autoscale.md
      - api/providers/nsg.md
      - api/providers/volume.md
      - api/providers/roles.md
      - api/providers/helper.md
      - api/providers/network_logging.md